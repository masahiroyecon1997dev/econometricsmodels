name: CI (engine)

on:
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "about.hbs"
      - "about.toml"
      - "THIRD-PARTY-LICENSES.html"
      - ".github/workflows/ci_engine.yml"
  # pull_requestにはpathsフィルタを付けない。必須ステータスチェックとして
  # ブランチルールに登録しているため、対象パスに触れないPRでも必ず結果が
  # 報告されるようにする（フィルタがあると該当PRで一度もチェックが実行されず、
  # マージ不能になる）。
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test:
    name: cargo test / clippy / fmt (engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: clippy, rustfmt

      - name: cargo fmt --check
        run: cargo fmt -p engine --check

      - name: cargo clippy
        run: cargo clippy -p engine --all-targets -- -D warnings

      - name: cargo test
        run: cargo test -p engine

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # workspace全体のCargo.lock（engine + engine_pybind）を対象にRustSecアドバイザリDBと
      # 突き合わせる。engine_pybind側の依存もここでカバーする
      # （ci_python.ymlのpip-auditはPython依存＝uv.lock専用）。
      #
      # rustsec/audit-checkアクションは不採用: `cargo audit --json`の出力をアクション内で
      # JSON.parse()しており、出力にANSI制御文字等が混ざると
      # "Unexpected token ... in JSON"で失敗する既知の不具合が未解決のまま残っている
      # （rustsec/audit-check#18, #33）。実際の脆弱性と無関係にCIが赤くなる偽陽性を避けるため、
      # アクションを介さず`cargo audit`をテキスト出力のまま直接実行する。
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          # バージョンは.devcontainer/DockerfileのCARGO_AUDIT_VERSIONと揃える
          tool: cargo-audit@0.22.2

      - name: cargo audit
        run: cargo audit

  licenses:
    name: THIRD-PARTY-LICENSES.html up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 配布物（wheel/sdist）に同梱する依存クレートのライセンス一覧が、Cargo.lockと
      # 食い違っていないことを確認する。MIT/Apache-2.0は配布物に著作権表示・ライセンス文を
      # 含めることを求めるため、依存の更新で一覧が古くなると条件を満たさなくなる。
      # 失敗したらローカルで同じコマンドを実行して差分をコミットする。
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          # バージョンは.devcontainer/DockerfileのCARGO_ABOUT_VERSIONと揃える
          tool: cargo-about@0.9.2

      - name: Regenerate THIRD-PARTY-LICENSES.html
        run: cargo about generate about.hbs -o THIRD-PARTY-LICENSES.html

      - name: Fail if the committed file is stale
        run: |
          git diff --exit-code -- THIRD-PARTY-LICENSES.html || {
            echo "::error file=THIRD-PARTY-LICENSES.html::Out of date. Run: cargo about generate about.hbs -o THIRD-PARTY-LICENSES.html"
            exit 1
          }
