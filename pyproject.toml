[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "econometricsmodels"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["polars==0.40", "numpy==1.24"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "statsmodels==0.14.6",
]

[tool.maturin]
manifest-path = "python/Cargo.toml"
python-source = "python_src"
module-name = "econometricsmodels._lib"
features = ["pyo3/extension-module"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]


