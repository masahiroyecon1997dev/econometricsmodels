site_name: econometricsmodels
site_description: Econometric estimators for scripts, pipelines, and apps, numerically verified against statsmodels, linearmodels, and R
repo_url: https://github.com/masahiroyecon1997dev/econometricsmodels
repo_name: masahiroyecon1997dev/econometricsmodels

# このファイル自体がdocs/直下にあるため、同じdocs/をdocs_dirとして扱う
# （デフォルトの"docs/mkdocs.yml相対docs/"にはしない）。docs/spec/・docs/performance/は
# ビルド対象に含まれるがnavには載せない
# （CLAUDE.md 10章「ソースとしては誰でも閲覧可能という前提で運用する」）。
# 利用者向けの横断解説はdocs/guide/に置き、navに載せる。
docs_dir: .
site_dir: ../site

# docs_dirが`.`のため、何も指定しないとdocs/配下の全ファイルがサイトに出力され、
# 検索の索引にも入る。実装途中の設計ノート(planning/)、設定ファイル自体、gitignore対象の
# 計測結果JSON(performance/results/)は公開サイトに出さない。パターンは.gitignore形式で、
# docs_dirからの相対パス。
exclude_docs: |
  planning/
  mkdocs.yml
  performance/results/

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - API Reference:
      - OLS: api/ols.md
      - WLS: api/wls.md
      - Logit: api/logit.md
      - Probit: api/probit.md
      - Tobit: api/tobit.md
      - IV: api/iv.md
      - FE: api/fe.md
      - RE: api/re.md
  - Guides:
      - Accepted data: guide/accepted-data.md
      - Validation and errors: guide/validation.md
      - Error codes: guide/error-codes.md
      - Inference conventions: guide/inference-conventions.md
      - Verification: guide/verification.md
      - Performance: guide/performance.md
      - Performance results: guide/performance-results.md

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.superfences

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            merge_init_into_class: true
            # PyO3コンパイル済みクラスは動的検査でdunderメソッド（__new__/__repr__等）も
            # メンバーとして拾われるため、明示的に除外する。
            filters:
              - "!^_"
