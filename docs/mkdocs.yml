site_name: econometricsmodels
site_description: Econometric estimators for scripts, pipelines, and apps, numerically verified against statsmodels, linearmodels, and R
repo_url: https://github.com/masahiroyecon1997dev/econometricsmodels
repo_name: masahiroyecon1997dev/econometricsmodels

# このファイル自体がdocs/直下にあるため、同じdocs/をdocs_dirとして扱う
# （デフォルトの"docs/mkdocs.yml相対docs/"にはしない）。
# 公開サイトに載せるのは英語のページ（index.md・getting-started.md・api/・guide/）のみ。
# 日本語の内部ドキュメント（spec/・performance/・planning/）は下のexclude_docsで外す
# （リポジトリ自体はpublicなので、ソースとしては閲覧可能という前提は変わらない）。
docs_dir: .
site_dir: ../site

# docs_dirが`.`のため、何も指定しないとdocs/配下の全ファイルがサイトに出力され、
# 検索の索引にも入る。日本語の内部ドキュメント（仕様書spec/・性能比較の開発ノートperformance/・
# 実装途中の設計ノートplanning/）と設定ファイル自体は公開サイトに出さない。
# パターンは.gitignore形式で、docs_dirからの相対パス。
exclude_docs: |
  planning/
  spec/
  performance/
  mkdocs.yml

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - API Reference:
      - OLS: api/ols.md
      - WLS: api/wls.md
      - Logit: api/logit.md
      - Probit: api/probit.md
      - Tobit: api/tobit.md
      - IV: api/iv.md
      - FE: api/fe.md
      - RE: api/re.md
  - Methods:
      - OLS: methods/ols.md
      - WLS: methods/wls.md
  - Guides:
      - Accepted data: guide/accepted-data.md
      - Validation and errors: guide/validation.md
      - Error codes: guide/error-codes.md
      - Inference conventions: guide/inference-conventions.md
      - Verification: guide/verification.md
      - Performance: guide/performance.md
      - Performance results: guide/performance-results.md

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.superfences

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            merge_init_into_class: true
            # PyO3コンパイル済みクラスは動的検査でdunderメソッド（__new__/__repr__等）も
            # メンバーとして拾われるため、明示的に除外する。
            filters:
              - "!^_"
