[package]
name = "engine_pybind"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "_lib"
crate-type = ["cdylib"]

[dependencies]
# サプライチェーン攻撃対策として`=`で完全固定する（ルートCargo.tomlの[workspace.dependencies]と同方針）。
pyo3 = { version = "=0.29.0", features = ["extension-module"] }
engine = { path = "../engine" }