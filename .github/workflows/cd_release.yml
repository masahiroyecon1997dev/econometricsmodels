name: CD (release build)

# トリガーはタグpushとworkflow_dispatchのみ（マルチOSビルドはWindows/macOSランナー
# を含み重いため、ci_python.ymlのようにPR毎には回さない）。
#
# GitHub Releaseの作成はPyPI公開が成功した後の最後のステップにしている（tag push
# → ビルド → PyPI公開 → GitHub Release作成、の順）。GitHubのImmutable Releases
# （2025-10-28 GA）は、一度publishされたreleaseのtagを削除しても二度と同名tagを
# 再利用できない仕様のため、「release publishedイベントをトリガーにPyPI公開する」
# 設計だとPyPI公開失敗時にtagが永久に使えなくなる。本ワークフローはtag pushを
# トリガーにし、PyPI公開が成功して初めてGitHub Releaseを作ることで、公開失敗時は
# tagを削除して同じバージョンで再実行できるようにしている。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # サポート対象Python（CLAUDE.md 12章）に限定してビルドする。--find-interpreterは
  # 使わない（manylinuxコンテナ内にある未サポートバージョン・free-threaded版まで
  # 全てビルドしてしまうため）。
  MATURIN_INTERPRETER_ARGS: -i python3.12 -i python3.13 -i python3.14

permissions:
  contents: read

jobs:
  linux:
    name: build (linux x86_64 manylinux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: |
            3.12
            3.13
            3.14

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: x86_64
          manylinux: auto
          args: --release --out dist ${{ env.MATURIN_INTERPRETER_ARGS }} --manifest-path engine_pybind/Cargo.toml

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-linux-x86_64
          path: dist

  windows:
    name: build (windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: |
            3.12
            3.13
            3.14
          architecture: x64

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: x64
          args: --release --out dist ${{ env.MATURIN_INTERPRETER_ARGS }} --manifest-path engine_pybind/Cargo.toml

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-windows-x64
          path: dist

  macos:
    name: build (macos ${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          # macOS Intel / Apple Siliconのランナー名は`maturin generate-ci github`が
          # 生成した値をそのまま採用した（GitHub Actionsのランナー命名はmaturin側が
          # 都度追従しているため、自前で決め打ちしない）。
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: |
            3.12
            3.13
            3.14

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist ${{ env.MATURIN_INTERPRETER_ARGS }} --manifest-path engine_pybind/Cargo.toml

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  sdist:
    name: build (sdist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist --manifest-path engine_pybind/Cargo.toml

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-sdist
          path: dist

  publish-pypi:
    name: publish to PyPI
    needs: [linux, windows, macos, sdist]
    # workflow_dispatchでのビルド確認実行時は公開しない。実際のtag pushのみ対象。
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # trusted publishing（OIDC）用。environmentの承認ゲート（Required reviewers）は
    # GitHub側（Settings > Environments > pypi）で設定する。environment名はPyPI側の
    # pending publisher設定の Environment name と一致させること。
    environment:
      name: pypi
      url: https://pypi.org/project/econometricsmodels/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      # 他のactionと異なりSHAでのピン留めはできない。このactionはDockerコンテナ
      # actionで、`uses:`に書いたref文字列をそのままghcr.ioのイメージタグとして
      # 使う実装（pypa/gh-action-pypi-publishのcreate-docker-action.py）のため、
      # 公開イメージが存在しないコミットSHAを指定するとmanifest unknownで失敗する
      # （v0.1.0初回リリース時に実際に発生・確認済み）。バージョンタグでの参照が
      # 唯一動作する方式のため、ここに限りSHAピン留めの方針の例外とする。
      - uses: pypa/gh-action-pypi-publish@v1.14.1
        with:
          # tag再push（公開失敗後の再実行）で、既に成功済みのファイルを
          # 再アップロードしようとして400エラーになるのを防ぐ。
          skip-existing: true

  create-github-release:
    name: create GitHub Release
    needs: [publish-pypi]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
