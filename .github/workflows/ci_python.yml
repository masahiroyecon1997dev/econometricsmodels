name: CI (python)

on:
  push:
    branches: [main]
    paths:
      - "python_package/**"
      - "engine_pybind/**"
      - "pyproject.toml"
      - "uv.lock"
      - "tests/**"
      # benchmark/配下のフィクスチャ生成モジュールは pytest が import 時に読み込む
      # （定数・ヘルパーの単一定義元）。壊れると pytest も落ちるため CI をトリガーする。
      - "benchmark/**"
      # エラーカタログからErrorCode・公開ドキュメントを生成するスクリプト（--checkをCIで回す）。
      - "tools/**"
      # testジョブが import 時間チェック（performance/check_import_time.py）を回す。
      - "performance/**"
      - ".github/workflows/ci_python.yml"
  # pull_requestにはpathsフィルタを付けない（ci_engine.ymlと同じ理由、
  # 「必須ステータスチェック」参照）。
  pull_request:
  # pip-auditジョブだけを週1回実行する(ci_engine.ymlのscheduleと同じ理由。
  # 他のジョブはif: github.event_name != 'schedule'で飛ばす)。
  schedule:
    - cron: "0 1 * * 1" # 毎週月曜 01:00 UTC

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test:
    name: pytest / ruff (py${{ matrix.python-version }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}

      # --locked: pyproject.tomlとuv.lockの不整合（ロック忘れ）をCIで検知するため、
      # --frozen（無検証でuv.lockをそのまま使う）ではなくこちらを使う。
      # testグループのみ（`dev`はuvが既定で含める。maturinはdevグループに定義済み）。
      # benchmark/docsグループはCIでは使わない方針（pyproject.tomlのコメント参照）。
      - name: uv sync (test group)
        run: uv sync --locked --group test

      - name: maturin develop
        run: uv run --locked --group test maturin develop

      # パッケージ健全性: import 時間の回帰ゲート。直前の
      # maturin develop でビルドしたデバッグ拡張をそのまま使う（追加ビルド無し・
      # 実行数秒）。判定値は `import econometricsmodels` − `import polars` の差分で、
      # polars 分（import 時間の約 98%）を相殺し自前ラッパー + `_lib` の dlopen/init
      # だけを見る。デバッグビルドの差分は悲観側に出るため、閾値内ならリリースは
      # さらに速いだけで安全側。詳細は docs/performance/package-health.md。
      - name: import time check (package health)
        run: uv run --locked --group test python -m performance.check_import_time

      # エラーカタログ（Rustの正本）から生成したErrorCodeと公開ドキュメントの表が
      # 最新であること。カタログを変えたら `python tools/render_error_catalog.py`
      # で再生成してコミットする。
      - name: error catalog outputs (--check)
        run: uv run --locked --group test python tools/render_error_catalog.py --check

      # --check-error-coverage: 全体実行の終了時に、移行済みのエラー`code`が
      # すべて一度はテストで送出されたこと（tests/support/_errors.py）を確認する。
      # --check-cov-coverage: 全体実行の終了時に、読み込んだ係数の分散共分散行列の
      # フィクスチャが、すべて一度はテストで比較されたこと（tests/support/_fixture_cov.py）を確認する。
      - name: pytest
        run: uv run --locked --group test pytest tests --check-error-coverage --check-cov-coverage

      - name: ruff check
        run: uv run --locked --group test ruff check .

      - name: ruff format --check
        run: uv run --locked --group test ruff format --check .

      # サポートする最古のpolarsでもテストが通ることを確認する(pyproject.tomlの
      # `polars>=`の下限と同じバージョンにする。通ることを確認した最古のバージョンが
      # 下限であり、それより古いとEnum型の時点列が静かに別の値になるなどの問題がある)。
      # 拡張モジュールはPythonのpolarsのバージョンに依存しないため、ビルド済みのものを
      # そのまま使う。uv.lockの環境を書き換えるので、このステップは最後に置く。
      - name: pytest (oldest supported polars)
        if: matrix.python-version == '3.12'
        run: |
          uv pip install polars==1.38.1
          uv run --no-sync python -c "import polars; assert polars.__version__ == '1.38.1', polars.__version__"
          uv run --no-sync pytest tests

  engine_pybind-lint:
    name: cargo test / clippy / fmt (engine_pybind)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: clippy, rustfmt

      # engine_pybindはci_engine.yml（-p engineのみ対象）の対象外のため、ここで担当する。
      # pyo3のビルドスクリプトはリンク可能なlibpythonを必要とするが、
      # abi3等のバージョン限定cfgを使っていないため、どの版でも足りる
      # （検証はtestジョブのマトリクスが担うので、このジョブのマトリクス化は不要）。
      # ランナー標準のpython3には頼らない: ubuntu-latestが26.04になった際、
      # pyo3が選んだpython3.12のlibpythonが見つからずリンクに失敗した。
      # 版はtestジョブのマトリクスの最大値に合わせる（新しいPythonをマトリクスに
      # 足すとき、ここも同時に上げる）。「>=3.12」等の範囲指定は、pyo3が未対応の
      # 新版が出た時点でこのジョブだけ予告なく落ちるため使わない。
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      #
      # cargo test: `crate-type = ["cdylib", "rlib"]`・`pyo3`の
      # `extension-module`フィーチャ非直接指定への変更により`cargo test -p engine_pybind`が
      # 可能になった（`extension-module`はmaturin実行時のみ`pyproject.toml`側から有効化する
      # 設計、`engine_pybind/Cargo.toml`のコメント参照）。これに伴い追加した
      # `nonlinear/logit.rs`の`build_logit_input`系テストがCIで実行されるようにする。
      - name: cargo test
        run: cargo test -p engine_pybind

      - name: cargo fmt --check
        run: cargo fmt -p engine_pybind --check

      - name: cargo clippy
        run: cargo clippy -p engine_pybind --all-targets -- -D warnings

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"

      # testグループのみを対象にする（本ワークフローが実際にインストールする依存と
      # 一致させる。benchmark/docsグループはCIでは使わない方針のため対象外）。
      # pip-auditはauditグループに版固定(==)で入れ、uv.lockにハッシュごと記録する
      # （`uvx`・`--with`のように実行のたびにPyPIの最新版を解決しない）。
      # pip-auditは依存パッケージのみを監査対象にし、econometricsmodels自体はPyPI未公開の
      # ためスキップされる（想定通り）。extension moduleのビルド（maturin develop）は
      # 監査結果に影響しないため、Rustツールチェーンのセットアップごと省略する。
      - name: uv sync (test + audit groups)
        run: uv sync --locked --group test --group audit

      - name: pip-audit
        run: uv run --locked --group test --group audit pip-audit
