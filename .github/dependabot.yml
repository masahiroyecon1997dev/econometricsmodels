version: 2

updates:
  # engine/engine_pybind（workspaceルート1つでCargo.lock全体をカバーする）
  - package-ecosystem: "cargo"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 10
    # セキュリティアップデートPRは常にcooldown対象外（GitHub側の既定動作、設定不要）。

  # python_package/pyproject.toml + uv.lock。"pip"ではなく"uv"を使う
  # （PEP 735の[dependency-groups]・uv.lock更新に対応した専用エコシステム。
  # test/benchmark/dev/docs全グループが対象になる）。
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 10

  # .github/workflows/配下の全ワークフローで使っているGitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 10

  # .devcontainer/Dockerfileのベースイメージ（python:3.14-slim-bookworm）。
  # Rパッケージ・R本体はDependabot非対応のため別途check_r_updates.ymlで確認する。
  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 10

  # .devcontainer/devcontainer.jsonのfeature（github-cli・claude-code）と
  # devcontainer-lock.json。ルートを指定すれば.devcontainer/を探索する。
  - package-ecosystem: "devcontainers"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 10
