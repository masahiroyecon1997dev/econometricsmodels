# cargo-audit（.github/workflows/ci_engine.ymlのauditジョブ）の設定。
# 以下はcargo auditが実際に検知した既知の脆弱性のうち、上流（pyo3-polars/polars）が
# 対応バージョンを未公開のため現時点では修復不能と判明した分（詳細はdocs/spec/ci-cd-notes.md
# 「セキュリティ」参照）。pyo3 0.29.2への更新でRUSTSEC-2026-0176/0177は解消済み。
# ここでのallow-listは「無視してよい」という判断ではなく、
# 「上流待ちの既知課題でci_engine.ymlをブロックしない」ための措置。上流の対応状況を
# 追跡し、該当RUSTSEC IDが解消できたら、そのタイミングでこのignore listから削除すること。
[advisories]
ignore = [
    "RUSTSEC-2026-0194", # quick-xml 0.39.4（polars→object_store経由、ビルドには含まれない未使用のオプション依存）: 重複属性名チェックが二次時間。0.41.0+で修正（上流待ち）
    "RUSTSEC-2026-0195", # quick-xml 0.39.4（polars→object_store経由、ビルドには含まれない未使用のオプション依存）: 名前空間宣言の無制限確保によるDoS。0.41.0+で修正（上流待ち）
    "RUSTSEC-2025-0141", # bincode 2.0.1 unmaintained（polars-utilsのserde機能経由、ビルドには含まれない未使用のオプション依存）: polars-utilsが`<3`を要求するため修正版へ上げられない（polars待ち）
    "RUSTSEC-2024-0436", # paste 1.0.15 unmaintained（faer→gemm/pulp、およびargmin経由。proc-macroとして実際にビルドされる）: 代替版なし。faerとargminの両方が脱paste版を出すまで解消不可（上流待ち）
]
