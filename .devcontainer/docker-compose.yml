services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USERNAME: vscode
        USER_UID: 1000
        USER_GID: 1000
    volumes:
      - ..:/workspaces/econometricsmodels:cached
      - cargo-registry:/home/vscode/.cargo/registry
      - cargo-git:/home/vscode/.cargo/git
    network_mode: "bridge"
    user: vscode
    command: sleep infinity

volumes:
  cargo-registry:
  cargo-git:
