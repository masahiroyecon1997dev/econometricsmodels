name: Benchmark (OLS performance)

# benchmark/performance/compare_performance.py（OLSのstatsmodels/pyfixestとの
# 実行時間・メモリ比較）を統一環境で実行し、結果をjob summaryに出力する。
#
# トリガーはタグpush（v*）+ workflow_dispatchのみ（ユーザー確認済み）。n=1,000,000込みの
# フルスイープは数分かかり重いため、cd_release.ymlと同じくPR/push毎には回さない。
# ソロ開発でコード変更頻度が低いこと、リリース単位で性能を記録できれば十分という判断。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # compare_performance.pyは`benchmark/performance/`をcwdにスクリプト実行され、
  # `import benchmark.linear...`（DGP）・`benchmark.common`（hac_auto_lag）を解決する
  # 必要がある。自身をサブプロセス再実行（_run_isolated）する分も含めリポジトリ
  # ルートをPYTHONPATHに載せる（Initiative A、`benchmark/`パッケージ化に伴う）。
  PYTHONPATH: ${{ github.workspace }}

permissions:
  contents: read

jobs:
  benchmark:
    name: compare_performance.py (OLS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      # test（statsmodels）+ benchmark（pyfixest, pyarrow）+ dev（maturin）の3グループが必要。
      # ci_python.ymlのtestグループのみとは異なり、compare_performance.pyがpyfixestとの
      # 比較も行うため。
      - name: uv sync (test + benchmark + dev groups)
        run: uv sync --locked --group test --group benchmark --group dev

      # 【最重要】必ずreleaseビルドで計測する。デフォルトの`maturin develop`（debugビルド）
      # のままだと最大140倍遅い誤った結果になることを実測済み
      # （docs/spec/ols-performance-notes.md「最重要の教訓」参照）。
      - name: maturin develop --release
        run: uv run --locked --group test --group benchmark --group dev maturin develop --release

      - name: compare_performance.py
        working-directory: benchmark/performance
        run: |
          uv run --locked --group test --group benchmark --group dev \
            python compare_performance.py --repeats 3 --output results.json

      - name: render job summary
        working-directory: benchmark/performance
        run: |
          uv run --locked --group test --group benchmark --group dev \
            python render_performance_summary.py results.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ols-performance-results
          path: benchmark/performance/results.json
