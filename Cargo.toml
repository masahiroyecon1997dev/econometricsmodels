[workspace]
resolver = "3"
members = [
    "engine",
    "engine_pybind",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
publish = false
description = "統計・計量経済学の分析手法を提供するRustエンジン（econometricsmodelsのPyO3バインディング対象）"
repository = "https://github.com/masahiroyecon1997dev/econometricsmodels"

[workspace.dependencies]
# 各crateからは `{ workspace = true }` で参照する。
# サプライチェーン攻撃対策として、全依存を`=`で完全固定する（キャレット等の範囲指定にしない）。
# アップグレードは意図的に行い、その都度動作確認する。
thiserror = "=2.0.19"
# faer: rust-style.md の方針により明示的にバージョン固定（APIが変わりうるため）。
# 実際に engine の [dependencies] へ追加するのは別issue（ENGINE_DEPS: engineクレートへの依存追加）で行う。
# ここでは workspace 単位でバージョンだけ先に固定しておく。
faer = "=0.24.4"
# statrs: t分布のCDF・逆CDF（classical/HC/HAC標準誤差のp値・信頼区間の計算に使用、Issue #9）。
# pure Rustでsystem BLAS/LAPACK不要、faerの方針と一貫する。
# default-features = false でnalgebra/rand機能を無効化し、CDF計算に必要な最小限の依存に絞る。
# （メンバー側の[dependencies]でdefault-featuresを上書きできないため、ここで指定する）
statrs = { version = "=0.19.0", default-features = false }
# argmin: 非線形モデル（Logit/Probit/Tobit）のMLE数値最適化。
# argmin-mathのfaerバックエンドはfaer 0.23までしか対応しておらず、本プロジェクトのfaerピン
# （=0.24.4）と噛み合わないため使わない（docs/planning/specs/nonlinear-implementation-notes.md
# 「argmin-mathのfaerバックエンド不使用」参照）。代わりにargmin-mathの`vec`機能
# （追加の線形代数クレート不要、`Vec<f64>`/`Vec<Vec<f64>>`への実装のみ）を使う。
# モデル固有の尤度・勾配・Hessian計算自体は引き続きfaerで行い、argminに値を渡す境界でのみ変換する。
argmin = "=0.11.0"
argmin-math = { version = "=0.5.1", default-features = false, features = ["vec"] }
# proptest: property-basedテスト（testing-policy.md「将来的に検討する技術」、Issue #102）。
# dev-dependency専用（配布物には含まれない）。
proptest = "=1.11.0"