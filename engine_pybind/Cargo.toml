[package]
name = "engine_pybind"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description.workspace = true
repository.workspace = true

[lib]
name = "_lib"
# `rlib`は追加した（`cargo test -p engine_pybind`を可能にするため。詳細は下記
# `pyo3`のコメント参照）。`cdylib`のみだと`cargo test`が生成する単体テストバイナリが
# クレート自体をリンクできない。
crate-type = ["cdylib", "rlib"]

[dependencies]
# サプライチェーン攻撃対策として`=`で完全固定する（ルートCargo.tomlの[workspace.dependencies]と同方針）。
# pyo3のバージョンは0.29.0からダウングレードしている。理由は以下pyo3-polarsのコメント参照。
#
# `extension-module`フィーチャはここでは有効化しない（判明・修正済み）。
# `extension-module`はPythonインタプリタにdlopenされる前提でlibpythonへの静的リンクを
# 意図的に省く仕様のため、`cargo build`/`cargo test`が生成する単体の実行バイナリ
# （dlopenされず自身で起動する）とは相性が悪く、`PyExc_TypeError`等のCPython C API
# シンボルがリンク時に未定義になりビルド失敗する（`cargo test -p engine_pybind`実行時に
# 実際に発生・確認済み）。実際のPython拡張モジュール（wheel）としてのビルドは
# `pyproject.toml`の`[tool.maturin] features = ["pyo3/extension-module"]`が
# `maturin build`/`maturin develop`実行時にこのフィーチャを外部から有効化するため、
# 配布物には引き続き反映される（`cargo`単体のビルド・テストとは別経路）。
pyo3 = { version = "=0.29.2" }
# polars（Rustクレート）とpyo3-polars: バージョンはPython側pyproject.tomlのpolars==1.42.1と
# 数字を合わせるものではない（Rustクレートpolarsは0.5x系、Python側は1.x系で既に別の
# バージョン体系に分離済み）。pyo3-polarsが使うpolars_ffi::version_0という安定版FFI
# プロトコル（Arrow C Data Interfaceに近い、バージョン非依存のインターフェース）経由で
# 互換性が担保される。
# crates.io公開版pyo3-polars 0.28.0（2026-08-04公開）がpyo3="^0.29"・polars="^0.55.1"を
# 要求するようになったため、Issue #49の再開条件を満たしたとして三者同時に上げた
# （旧版はpyo3-polars 0.27.0がpyo3="^0.28"のままだったため、pyo3=0.28.3/polars=0.54.4に
# 固定していた。詳細はIssue #49参照）。
polars = "=0.55.2"
pyo3-polars = "=0.28.0"
faer = { workspace = true }
engine = { path = "../engine" }