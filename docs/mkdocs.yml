site_name: econometricsmodels
site_description: Econometric estimators for scripts, pipelines, and apps, numerically verified against statsmodels, linearmodels, and R
repo_url: https://github.com/masahiroyecon1997dev/econometricsmodels
repo_name: masahiroyecon1997dev/econometricsmodels

# このファイル自体がdocs/直下にあるため、同じdocs/をdocs_dirとして扱う
# （デフォルトの"docs/mkdocs.yml相対docs/"にはしない）。
# 公開サイトに載せるのは英語のページ（index.md・getting-started.md・usage/・api/・methods/・guide/）のみ。
# 日本語の内部ドキュメント（spec/・performance/・planning/）は下のexclude_docsで外す
# （リポジトリ自体はpublicなので、ソースとしては閲覧可能という前提は変わらない）。
docs_dir: .
site_dir: ../site

# docs_dirが`.`のため、何も指定しないとdocs/配下の全ファイルがサイトに出力され、
# 検索の索引にも入る。日本語の内部ドキュメント（仕様書spec/・性能比較の開発ノートperformance/・
# 実装途中の設計ノートplanning/）と設定ファイル自体は公開サイトに出さない。
# パターンは.gitignore形式で、docs_dirからの相対パス。
exclude_docs: |
  planning/
  spec/
  performance/
  mkdocs.yml

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  # 系統（engine/src/の linear・nonlinear・iv・panel）ごとにまとめる。
  - Models:
      - Linear models:
          - OLS:
              - Usage: usage/ols.md
              - Options and results: api/ols.md
              - Definitions: methods/ols.md
          - WLS:
              - Usage: usage/wls.md
              - Options and results: api/wls.md
              - Definitions: methods/wls.md
      - Nonlinear models:
          - Logit:
              - Usage: usage/logit.md
              - Options and results: api/logit.md
              - Definitions: methods/logit.md
          - Probit:
              - Usage: usage/probit.md
              - Options and results: api/probit.md
              - Definitions: methods/probit.md
          - Tobit:
              - Usage: usage/tobit.md
              - Options and results: api/tobit.md
              - Definitions: methods/tobit.md
      - Instrumental variables:
          - IV:
              - Usage: usage/iv.md
              - Options and results: api/iv.md
              - Definitions: methods/iv.md
      - Panel models:
          - FE:
              - Usage: usage/fe.md
              - Options and results: api/fe.md
              - Definitions: methods/fe.md
          - RE:
              - Usage: usage/re.md
              - Options and results: api/re.md
              - Definitions: methods/re.md
  - Guides:
      - Accepted data: guide/accepted-data.md
      - Validation and errors: guide/validation.md
      - Error codes: guide/error-codes.md
      - Inference conventions: guide/inference-conventions.md
      - Pickling and copying: guide/pickling.md
      - Errors (API): api/errors.md
  - Verification and performance:
      - Verification: guide/verification.md
      - Performance: guide/performance.md
      - Performance results: guide/performance-results.md

# 内部リンクとアンカーの切れをビルド時に警告する。
validation:
  links:
    anchors: warn

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.superfences
  # 数式は\( \)と\[ \]で書き、MathJaxで描画する（下のextra_javascript）。
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            merge_init_into_class: true
            # クラスの先頭に属性・メソッドの一覧表を出し、右の目次にも並べる
            # （全部を読まずに目的のプロパティへ飛べるようにする）。
            summary: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            docstring_section_style: table
            # PyO3コンパイル済みクラスは動的検査でdunderメソッド（__new__/__repr__等）も
            # メンバーとして拾われるため、明示的に除外する。
            filters:
              - "!^_"
