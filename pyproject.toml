[build-system]
requires = ["maturin<2.0,>=1.14"]
build-backend = "maturin"

[project]
name = "econometricsmodels"
version = "0.9.0"
description = "Econometric estimators for scripts, pipelines, and apps, numerically verified against statsmodels, linearmodels, and R"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "masahiroyecon1997dev", email = "masahiroyecon1997dev@gmail.com" },
]
keywords = ["econometrics", "statistics", "regression", "ols", "logit", "probit", "tobit", "instrumental-variables", "panel-data", "polars"]
dependencies = [
    # 下限は、全テストが通ることを確認した最古のバージョン(ci_python.ymlのtestジョブが
    # 同じバージョンでpytestを回す。変えるときは両方を揃える)。上限は付けない
    # (利用者が入れているpolarsをダウングレードしないため)。1.31以下はEnum型の時点列が
    # 静かに別の値になり、1.36以下はFloat16列を読めない。1.27以下は動かない。
    # 拡張モジュールはRust側のpolarsクレートのFFI経由でPythonのpolarsを読むため、
    # 新しいpolarsは開発側(uv.lock、Dependabot)で追従する。
    "polars>=1.38.1",
]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Repository = "https://github.com/masahiroyecon1997dev/econometricsmodels"
Issues = "https://github.com/masahiroyecon1997dev/econometricsmodels/issues"
Changelog = "https://github.com/masahiroyecon1997dev/econometricsmodels/blob/main/CHANGELOG.md"

[tool.maturin]
manifest-path = "engine_pybind/Cargo.toml"
module-name = "econometricsmodels._lib"
python-source = "python_package"
features = ["pyo3/extension-module"]
# 依存クレートのライセンス一覧レポート（`cargo about generate about.hbs -o
# THIRD-PARTY-LICENSES.html`で生成。更新は/releaseの手順に含め、ci_engine.ymlの
# `licenses`ジョブが古さを検出する）を
# 配布物（wheel/sdist）に同梱する。
#
# LICENSEも明示的に含める。maturinはCLI上「Including license file」と表示するが、
# 実際にはsdist（tar.gz）にLICENSEファイル自体を含めない一方、PKG-INFOには
# `License-File: LICENSE`を書き込むため、PyPI側の検証で
# 「License-File LICENSE does not exist in distribution file」エラーになる
# （v0.1.0初回リリース時に実際に発生・確認済み）。includeへ明示的に足すことで回避する。
include = ["THIRD-PARTY-LICENSES.html", "LICENSE"]
# 開発用のファイルを配布物に入れない。CLAUDE.mdは開発者向けの指示で、python_package配下の
# ものはwheelにも入り利用者のsite-packagesに置かれる（利用者のAIエージェントに指示として
# 読み込まれうる）。error_catalog_golden.txtはRustの単体テスト専用（`include_str!`は
# `#[cfg(test)]`内のみ）で、ビルドには不要。
exclude = ["**/CLAUDE.md", "**/.gitkeep", "**/error_catalog_golden.txt"]

[dependency-groups]
# CI（ci_python.yml）が使う: pytest tests / ruff check . / ruff format --check .
# benchmark_performance.ymlも（statsmodels・pyarrow目的で）このグループを使う。
# statsmodelsはtests/fixtures/benchmarks/のフィクスチャ生成に使った主リファレンス実装のため、
# `==`で厳密固定する（.claude/rules/testing-policy.md「ベンチマーク値のフィクスチャ化」参照）。
# バージョンを上げる場合はフィクスチャの再生成とセットで行うこと。
test = [
    "pytest==9.1.1",
    "numpy==2.5.3",
    "statsmodels==0.15.0",
    # IV（2SLS/GMM）のフィクスチャ生成に使った主リファレンス実装
    # （`docs/spec/iv-spec.md`4章）。statsmodelsと同じ理由で`==`厳密固定。
    "linearmodels==7.0",
    "ruff==0.16.10",
    # Wooldridge実データでのクロスチェックテスト用（tests/support/_helpers.pyの
    # wooldridge_loader）。標準CIで確実に実行されるよう
    # 専用グループからここへ移した。依存はpandasのみで、statsmodels/linearmodels経由で既に
    # 間接的に入っているため追加コストはwooldridge本体のwheelのみ。実データ
    # 自体はこのパッケージのwheel内に留まりリポジトリへは再配布しないため、
    # 下記pyarrow同様、ライセンス上の制約（実データをCSVとして
    # 固定・再配布しない方針、testing-policy.md参照）とは無関係。
    "wooldridge==0.5.0",
    # polars.DataFrame.to_pandas()が内部で要求する。テストがリファレンス実装
    # （statsmodels/linearmodels/R）へ渡すためpandasに変換する箇所と、benchmark/・
    # performance/配下のリファレンス実装アダプタ（compare_*.py）が使う。pandas側は
    # 直接依存に含めない。
    "pyarrow==26.0.0",
]
dev = [
    "maturin==1.15.0",
]
# ci_python.ymlのpip-auditジョブ専用（testグループと併用して依存の脆弱性を監査する）。
# `uvx`/`--with`で実行のたびに最新版を解決しないよう、ここへ版固定で入れる。
audit = [
    "pip-audit==2.10.1",
]
# mkdocsドキュメント生成専用（CIでは使わない。cd_docs.ymlでのCI組み込みは別issue）。
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
    "mkdocstrings[python]==1.0.6",
]

# .claude/rules/python-style.md「Lint / フォーマット」で確定済みの line-length=79
# （PEP8標準）のみ設定する。有効化するRuffルール群の詳細は未確定のまま
# （デフォルトのE/Fルールセットを使う）。
[tool.ruff]
line-length = 79

# pytest実行時にsys.pathへ載せるパス。
# - "."   : `import benchmark.<系統>....` を1経路で解決（旧: 各テストファイルの
#           `sys.path.insert`＋devcontainerのPYTHONPATHを全廃したもの）。
# - "tests/support": 共有ヘルパー・系統別ヘルパー（`tests/support/_helpers.py` 等）の置き場。
#           `tests/` の全サブディレクトリのテストが `from _helpers import ...` 等の
#           裸importで解決できるようにする（サブディレクトリからでも1経路）。
[tool.pytest.ini_options]
pythonpath = [".", "tests/support"]
