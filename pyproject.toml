[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "econometricsmodels"
version = "0.1.0"
description = "統計・計量経済学の分析手法を提供するPython API"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "polars==1.42.1",
]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
]

[tool.maturin]
manifest-path = "engine_pybind/Cargo.toml"
module-name = "econometricsmodels._lib"
python-source = "python_package"
features = ["pyo3/extension-module"]

[dependency-groups]
# CI（ci_python.yml）が使う: pytest tests/api_tests / ruff check . / ruff format --check .
# statsmodelsはtests/api_tests/fixtures/benchmarks/のフィクスチャ生成に使った主リファレンス実装のため、
# `==`で厳密固定する（.claude/rules/testing-policy.md「ベンチマーク値のフィクスチャ化」参照）。
# バージョンを上げる場合はフィクスチャの再生成とセットで行うこと。
test = [
    "pytest==9.1.1",
    "numpy==2.5.1",
    "statsmodels==0.14.6",
    "ruff==0.15.20",
]
# benchmark/ 配下のベンチマーク値生成スクリプト専用（CIでは使わない、随時実行するツール。
# CLAUDE.md 3章「benchmark/はtests/とは別ライフサイクル」参照）。
benchmark = [
    "pyfixest==0.60.0",
    "wooldridge==0.5.0",
]
dev = [
    "maturin==1.14.1",
]

# .claude/rules/python-style.md「Lint / フォーマット」で確定済みの line-length=79
# （PEP8標準）のみ設定する。有効化するRuffルール群の詳細は未確定のまま
# （デフォルトのE/Fルールセットを使う）。
[tool.ruff]
line-length = 79